<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quyen Plh Clothing">
    <title>Quyen Plh Clothing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="images/logo.png" as="image">
    <!-- Thêm Font Awesome vào trang -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">


  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    .order-form-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .product-summary {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .product-summary img {
      width: 200px;
      height: auto;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    .product-details {
      display: flex;
      flex-direction: column;
      justify-content: center;

    text-align: left;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
align-items: center;
    }

    input, textarea {
      padding: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      width: 100%;
    }

    button {
      padding: 12px;
      background-color: black;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;

     
      border-bottom: 1px solid #ccc;
    }



    nav ul li a {
      text-decoration: none;
    
   
    }

    .logo img {
    
    }

    .contact-info {
      font-size: 13px;
      line-height: 1.4;
      color: #555;
    }

    footer {
      text-align: center;
      padding: 20px 0;
      background-color: #f2f2f2;
      margin-top: 40px;
    }

    h1, h2 {
      margin-bottom: 16px;
font-size: 22px;
    }
@media (max-width: 480px) {
  .order-form {
    padding: 16px;
    width: 100%;
    box-sizing: border-box;
  }
}
@media (max-width: 480px) {
  .order-form h1 {
    font-size: 1.4rem;
    text-align: center;
  }

  .order-form p.description {
    font-size: 1rem;
    text-align: center;
  }
}
@media (max-width: 480px) {
  .order-form input,
  .order-form select,
  .order-form textarea {
    width: 100%;
    font-size: 1rem;
    padding: 10px;
    box-sizing: border-box;
    margin-bottom: 15px;
  }
}
@media (max-width: 480px) {
  .product-preview img {
    width: 100%;
    max-width: 300px;
    height: auto;
    margin: 0 auto;
    display: block;
  }
}
@media (max-width: 480px) {
  .order-form button[type="submit"] {
    width: 100%;
    padding: 12px;
    font-size: 1.1rem;
    margin-top: 10px;
  }
@media (max-width: 480px) {
.product-summary {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
flex-direction: column;
    align-items: center;
}
}

  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <nav>
      <ul>
        <li><a href="new.html">New</a></li>
        <li><a href="best.html">Best</a></li>
        <li><a href="top.html">Top</a></li>
        <li><a href="botton.html">Botton</a></li>
        <li><a href="dress.html">Dress</a></li>
        <li><a href="coat.html">Coat</a></li>
        <li><a href="acc.html">Acc</a></li>
      </ul>
    </nav>

    <div class="logo">
      <a href="index.html"><img src="images/logo.png" alt="Quyen PLH Logo" /></a>
    </div>

   
  </header>
 <div class="contact-info">
      <p><i class="fas fa-map-marker-alt"></i> Danang, Vietnam</p>
      <p><i class="fas fa-clock"></i> Open 8:00-20:00</p>
      <p><i class="fas fa-calendar-alt"></i> From Monday to Sunday</p>
    </div>

  <!-- ===== FORM ĐẶT HÀNG ===== -->
  <div class="order-form-container">
    <h1>Xác nhận đơn hàng</h1>

    <div class="product-summary">
      <img id="productImage" src="" alt="Ảnh sản phẩm" />
      <div class="product-details">
        <p><strong>Tên sản phẩm:</strong> <span id="productName"></span></p>
        <p><strong>Size:</strong> <span id="selectedSize"></span></p>
        <p><strong>Màu:</strong> <span id="selectedColor"></span></p>
        <p><strong>Số lượng:</strong> <span id="selectedQuantity"></span></p>
      </div>
    </div>

    <!-- FORM -->
    <form id="orderForm" action="https://formspree.io/f/xgvajyjw" method="POST">
      <h2>Thông tin khách hàng</h2>
      <input type="text" name="name" placeholder="Họ và tên" required />
      <input type="tel" name="phone" placeholder="Số điện thoại" required />
      <input type="email" name="email" placeholder="Email" required />
      <textarea name="address" rows="4" placeholder="Địa chỉ nhận hàng" required></textarea>

      <input type="hidden" name="productName" id="productNameHidden" />
      <input type="hidden" name="size" id="sizeHidden" />
      <input type="hidden" name="color" id="colorHidden" />
      <input type="hidden" name="quantity" id="quantityHidden" />
<input type="hidden" name="productImageHtml" id="imageHtmlHidden" />

      <!-- Không cần redirect -->
      <!-- <input type="hidden" name="_redirect" value="thank-you.html" /> -->

      <button type="submit">Gửi đơn hàng</button>

      <!-- Thông báo -->
      <p id="successMessage" style="display:none; color: green; margin-top: 15px; font-weight: bold;">
        ✅ Đặt hàng thành công. Cảm ơn bạn ♥
      </p>
    </form>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>&copy; 2025 Quyen PLH Clothing</p>
  </footer>

  <script>
    // Lấy thông tin từ URL
    const params = new URLSearchParams(window.location.search);
    const image = params.get("image");
    const size = params.get("size");
    const color = params.get("color");
    const quantity = params.get("quantity");
    const productName = params.get("product");

    if (image) document.getElementById("productImage").src = image;
    if (size) document.getElementById("selectedSize").textContent = size;
    if (color) document.getElementById("selectedColor").textContent = color;
    if (quantity) document.getElementById("selectedQuantity").textContent = quantity;
    if (productName) document.getElementById("productName").textContent = productName;

    document.getElementById("productNameHidden").value = productName || "-";
    document.getElementById("sizeHidden").value = size || "-";
    document.getElementById("colorHidden").value = color || "-";
    document.getElementById("quantityHidden").value = quantity || "1";
document.getElementById("imageHtmlHidden").value = image ? `<img src="${image}" width="200" />` : "";

    // Gửi form và hiện thông báo
    const form = document.getElementById("orderForm");
    const successMsg = document.getElementById("successMessage");

    form.addEventListener("submit", function (e) {
      e.preventDefault(); // Ngăn chuyển trang

      const formData = new FormData(form);

      fetch(form.action, {
        method: "POST",
        body: formData,
        headers: {
          Accept: "application/json",
        },
      })
        .then(response => {
          if (response.ok) {
            successMsg.style.display = "block";
            form.reset();
          } else {
            alert("Có lỗi xảy ra khi gửi đơn hàng. Vui lòng thử lại.");
          }
        })
        .catch(error => {
          alert("Không thể kết nối. Vui lòng thử lại.");
        });
    });
  </script>
</body>
</html>
