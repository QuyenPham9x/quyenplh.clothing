<!-- Thay thế đoạn <form> của bạn bằng phần dưới đây -->

<form id="orderForm">
  <h2>Thông tin khách hàng</h2>
  <input type="text" name="name" placeholder="Họ và tên" required />
  <input type="tel" name="phone" placeholder="Số điện thoại" required />
  <input type="email" name="email" placeholder="Email" required />
  <textarea name="address" rows="4" placeholder="Địa chỉ nhận hàng" required></textarea>

  <!-- Hidden fields -->
  <input type="hidden" name="productName" id="productNameHidden" />
  <input type="hidden" name="size" id="sizeHidden" />
  <input type="hidden" name="color" id="colorHidden" />
  <input type="hidden" name="quantity" id="quantityHidden" />

  <button type="submit">Gửi đơn hàng</button>
</form>

<!-- Popup -->
<div id="successPopup" style="display: none; position: fixed; top: 0; left: 0; 
  width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); 
  display: flex; justify-content: center; align-items: center; z-index: 999;">
  <div style="background: white; padding: 24px 30px; border-radius: 12px; text-align: center;">
    <p style="font-size: 20px;">🎉 Đặt hàng thành công!<br/>Cảm ơn bạn ♥</p>
    <button onclick="closePopup()" style="margin-top: 15px; padding: 10px 20px; background: black; color: white; border: none; border-radius: 6px;">Đóng</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const image = params.get("image");
  const size = params.get("size");
  const color = params.get("color");
  const quantity = params.get("quantity");
  const productName = params.get("product");

  if (image) document.getElementById("productImage").src = image;
  if (size) document.getElementById("selectedSize").textContent = size;
  if (color) document.getElementById("selectedColor").textContent = color;
  if (quantity) document.getElementById("selectedQuantity").textContent = quantity;
  if (productName) document.getElementById("productName").textContent = productName;

  document.getElementById("productNameHidden").value = productName || "-";
  document.getElementById("sizeHidden").value = size || "-";
  document.getElementById("colorHidden").value = color || "-";
  document.getElementById("quantityHidden").value = quantity || "1";

  const form = document.getElementById("orderForm");

  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const formData = new FormData(form);
    try {
      const response = await fetch("https://formspree.io/f/xgvajyjw", {
        method: "POST",
        body: formData,
        headers: {
          Accept: "application/json"
        }
      });

      if (response.ok) {
        document.getElementById("successPopup").style.display = "flex";
        form.reset();
      } else {
        alert("Gửi đơn hàng thất bại. Vui lòng thử lại.");
      }
    } catch (error) {
      alert("Lỗi kết nối. Vui lòng thử lại.");
    }
  });

  function closePopup() {
    document.getElementById("successPopup").style.display = "none";
  }
</script>
